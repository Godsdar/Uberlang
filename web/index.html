<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Uberlang: explore words, their origins, and connections across languages. Explore supported word histories, save discoveries, and return to your tree.">

  <title>Uberlang — Follow word histories</title>
  <link rel="icon" type="image/svg+xml" href="./concept/favicon.svg">
  <link rel="stylesheet" href="./concept/concept.css">

<body>
  <a class="lp-skip-link" href="#lingua-concept">Skip to word exploration</a>
  <main class="lp-demo-shell">
    <aside class="lp-legacy-backup" data-roots-backup hidden>
      <span>Your saved roots from the previous app are still on this device.</span>
      <button type="button" data-download-roots>Download saved roots</button>
      <span role="status" data-backup-status></span>
    </aside>
<div id="lingua-concept" tabindex="-1">
  <div class="lp-variants" aria-label="Notebook layouts">
    <section data-variant="Reading" aria-label="Notebook workspace"><div class="lp" id="lingua-reading" data-theme="tokyo" data-layout="reading"></div></section>
  </div>
</div>
  </main>
  <script type="module" src="./concept/concept.js"></script>
