name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop
        run: npm run build

      - name: Build extension
        run: npm run build:ext

      - name: Build web
        run: npm run build:web

      - name: Build and smoke-test API
        run: npm run build:server && npm run build:gateway && npm run smoke:server

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-server
          path: server-dist

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-desktop
          path: out

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-extension
          path: extension/dist

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-web
          path: web/dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image (typecheck + all surfaces)
        run: docker build --target ci -t lingua-ci .

      - name: Build web image (nginx)
        run: docker build --target web -t lingua-web .

      - name: Build API image (non-root Node runtime)
        run: docker build --target server -t lingua-server .

      - name: Smoke-test API container
        run: |
          docker run -d --name lingua-api -e LINGUA_API_KEY=ci-only-test-key-not-a-real-secret-000 lingua-server
          trap 'docker logs lingua-api; docker rm -f lingua-api' EXIT
          for attempt in $(seq 1 30); do
            if docker exec lingua-api node -e "fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker stop -t 15 lingua-api
              test "$(docker inspect -f '{{.State.ExitCode}}' lingua-api)" = 0
              exit 0
            fi
            sleep 1
          done
          exit 1

  language-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned model and engine
        run: python -m pip install -r requirements.txt
      - name: Validate grammar, offsets, HTTP boundary and privacy
        run: python -m unittest engine.test_analyzer engine.test_http_handler -v
      - name: Record engine benchmark (not an accuracy score)
        run: python -m scripts.engine-benchmark > engine-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: lingua-engine-benchmark
          path: engine-benchmark.json
