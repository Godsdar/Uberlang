appId: app.lingua.desktop
productName: Uberlang
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
publish: null
mac:
  target:
    - dmg
    - zip
  category: public.app-category.reference
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Education
  artifactName: ${productName}-${version}.${ext}
